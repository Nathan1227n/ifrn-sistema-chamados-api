services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chamados}
      POSTGRES_USER: ${POSTGRES_USER:-chamados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chamados_local}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://banco:5432/${POSTGRES_DB:-chamados}
      DB_USERNAME: ${POSTGRES_USER:-chamados}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-chamados_local}
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados_postgres:
